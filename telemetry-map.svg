<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vanguard telemetry event family map</title><desc id="desc">Twenty-two security events, eleven lifecycle events, and thirty-five critical integrity events.</desc>
  <rect width="1200" height="360" rx="12" fill="#030303"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#FFFFFF">
    <text x="48" y="48" font-size="16" letter-spacing="4" opacity=".58">TELEMETRY CATALOG / 68 DOCUMENTED CODES</text>
    <g transform="translate(48 88)">
      <g><rect width="1104" height="54" rx="8" fill="#131313" stroke="#FFFFFF" stroke-opacity=".18"/><rect width="357" height="54" rx="8" fill="#FFFFFF" opacity=".82"><animate attributeName="width" from="0" to="357" dur="1.1s" fill="freeze"/></rect><text x="18" y="34" font-size="14" fill="#030303">0XB000XXXX · 22 · SECURITY / POLICY</text></g>
      <g transform="translate(0 74)"><rect width="1104" height="54" rx="8" fill="#131313" stroke="#FFFFFF" stroke-opacity=".18"/><rect width="178" height="54" rx="8" fill="#FFFFFF" opacity=".58"><animate attributeName="width" from="0" to="178" dur="1.3s" fill="freeze"/></rect><text x="18" y="34" font-size="14">0X1000XXXX · 11 · LIFECYCLE</text></g>
      <g transform="translate(0 148)"><rect width="1104" height="54" rx="8" fill="#131313" stroke="#FFFFFF" stroke-opacity=".18"/><rect width="568" height="54" rx="8" fill="#FFFFFF" opacity=".92"><animate attributeName="width" from="0" to="568" dur="1.5s" fill="freeze"/></rect><text x="18" y="34" font-size="14" fill="#030303">0XE000XXXX · 35 · CRITICAL INTEGRITY</text></g>
      <text y="238" font-size="12" letter-spacing="3" opacity=".44">CODE · TRIGGER · SEVERITY · FAILURE PATH · DOCUMENTED LIMITATION</text>
    </g>
  </g>
</svg>
