<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Vanguard research surface map</title><desc id="desc">Protection, CPU probes, ETW hooks, capture and input, process policy, and hardware identity.</desc>
  <rect width="1200" height="520" rx="12" fill="#030303"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#FFFFFF">
    <text x="48" y="48" font-size="16" letter-spacing="4" opacity=".58">RECOVERED SURFACE MAP / SIX CONTROL PLANES</text>
    <g transform="translate(48 82)">
      <g><rect width="344" height="168" rx="10" fill="#131313" stroke="#FFFFFF" stroke-opacity=".23"/><text x="22" y="38" font-size="13" letter-spacing="3" opacity=".5">01 / PROTECTOR</text><text x="22" y="79" font-size="23" font-weight="700">RIOT0 · GRFN1</text><text x="22" y="112" font-size="14" opacity=".66">TLS · MAC · MBA · MPH</text><path d="M22 139H286" stroke="#FFFFFF" stroke-dasharray="7 8"><animate attributeName="stroke-dashoffset" from="0" to="30" dur="1.8s" repeatCount="indefinite"/></path></g>
      <g transform="translate(356)"><rect width="344" height="168" rx="10" fill="#131313" stroke="#FFFFFF" stroke-opacity=".23"/><text x="22" y="38" font-size="13" letter-spacing="3" opacity=".5">02 / CPU &amp; VMEXIT</text><text x="22" y="79" font-size="23" font-weight="700">14 PROBES</text><text x="22" y="112" font-size="14" opacity=".66">MSR · TSC · IPI · CR3</text><circle cx="300" cy="45" r="18" fill="none" stroke="#FFFFFF" stroke-dasharray="3 5"><animateTransform attributeName="transform" type="rotate" from="0 300 45" to="360 300 45" dur="4s" repeatCount="indefinite"/></circle></g>
      <g transform="translate(712)"><rect width="344" height="168" rx="10" fill="#131313" stroke="#FFFFFF" stroke-opacity=".23"/><text x="22" y="38" font-size="13" letter-spacing="3" opacity=".5">03 / SYSCALL PLANE</text><text x="22" y="79" font-size="23" font-weight="700">ETW 0XF33</text><text x="22" y="112" font-size="14" opacity=".66">STACK WALK · 24 SLOTS</text><path d="M280 36v66m-16-16 16 16 16-16" fill="none" stroke="#FFFFFF" opacity=".5"/></g>
      <g transform="translate(0 184)"><rect width="344" height="168" rx="10" fill="#131313" stroke="#FFFFFF" stroke-opacity=".23"/><text x="22" y="38" font-size="13" letter-spacing="3" opacity=".5">04 / CAPTURE &amp; INPUT</text><text x="22" y="79" font-size="23" font-weight="700">PIXEL · LBR</text><text x="22" y="112" font-size="14" opacity=".66">HSV · WDA · MOUCLASS</text><path d="M22 139h90m12 0h90m12 0h70" stroke="#FFFFFF" stroke-width="3" opacity=".38"><animate attributeName="opacity" values=".2;.65;.2" dur="2s" repeatCount="indefinite"/></path></g>
      <g transform="translate(356 184)"><rect width="344" height="168" rx="10" fill="#131313" stroke="#FFFFFF" stroke-opacity=".23"/><text x="22" y="38" font-size="13" letter-spacing="3" opacity=".5">05 / PROCESS POLICY</text><text x="22" y="79" font-size="23" font-weight="700">HANDLES · RIP</text><text x="22" y="112" font-size="14" opacity=".66">OB CALLBACK · KTRAP</text><rect x="272" y="28" width="42" height="54" rx="5" fill="none" stroke="#FFFFFF" opacity=".45"/><path d="m280 58 8 8 18-22" fill="none" stroke="#FFFFFF"/></g>
      <g transform="translate(712 184)"><rect width="344" height="168" rx="10" fill="#131313" stroke="#FFFFFF" stroke-opacity=".23"/><text x="22" y="38" font-size="13" letter-spacing="3" opacity=".5">06 / HARDWARE TRUST</text><text x="22" y="79" font-size="23" font-weight="700">TPM · PCI · GPU</text><text x="22" y="112" font-size="14" opacity=".66">CRB · HDE64 · SHA-256</text><path d="M276 34h32v32h-32zm-8 8h-10m10 16h-10m58-16h10m-10 16h10" fill="none" stroke="#FFFFFF" opacity=".48"/></g>
    </g>
